<script>
/* 手机兜底（最先运行）：任何一步出错都不会留下空白屏——页面上会显示原因；聊天软件里的内置浏览器会提示换浏览器 */
(function () {
  var shown = 0;
  function bar(id, html, bg, ms) {
    var d = document.getElementById(id); if (d) return d;
    d = document.createElement('div'); d.id = id;
    d.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:60;padding:10px 14px;border-radius:12px;border:2px solid #b9a77a;background:' + bg + ';color:#4a3a1a;font:15px/1.5 sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none;';   // 提示条本身不挡点击，只有“知道了”按钮能点
    d.innerHTML = html + ' <button style="margin-left:8px;padding:4px 12px;font:inherit;border-radius:8px;border:1px solid #b9a77a;background:#fff;color:#4a3a1a;pointer-events:auto">知道了</button>';
    d.getElementsByTagName('button')[0].onclick = function () { if (d.parentNode) d.parentNode.removeChild(d); };
    (document.body || document.documentElement).appendChild(d);
    if (ms) setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, ms);
    return d;
  }
  window.XY_bar = bar;
  window.XY_fail = function (msg) {
    if (shown++ > 2) return;
    var t = String(msg || '').replace(/[<>&]/g, ' ').slice(0, 160);
    bar('xyFail' + shown, '⚠ 游戏出了点问题：' + t + '<br>请换「Safari / Chrome」浏览器打开，或把这行字截图发给我。', '#ffe3d6');
  };
  window.addEventListener('error', function (e) { if (e && e.message) window.XY_fail(e.message + (e.lineno ? ' (行' + e.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function () { /* 视频 / 音频被拒绝播放等：不是致命的，忽略 */ });
  var ua = navigator.userAgent || '';
  if (/MicroMessenger|MQQBrowser|QQ\/|Weibo|FBAN|FBAV|Instagram|Line\/|DingTalk|AlipayClient|TikTok|musical_ly|baiduboxapp|Telegram|GSA\/|Twitter|Grok/i.test(ua)) {
    window.addEventListener('load', function () { bar('xyInApp', '你好像是在聊天软件里打开的。如果卡住或点不动，请用右上角菜单「在浏览器中打开」（Safari / Chrome）。', '#fff4c2', 9000); });
  }
})();
</script>
